[project]
name = "security-detection-engine-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-s --log-cli-level=INFO --log-format=%(levelname)s|%(name)s|%(message)s"
testpaths = ["tests"]
